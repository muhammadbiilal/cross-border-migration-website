name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Project pages live under /<repo-name>/, so the base href must match.
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      # Pages serves 404.html for unknown paths; the client-rendered shell
      # lets deep links such as /admin boot the app instead of a dead page.
      - run: cp dist/crossbordermigration/browser/index.csr.html dist/crossbordermigration/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/crossbordermigration/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
