@if (destination(); as place) {
  <app-page-hero [eyebrow]="place.region" [title]="place.name" [lede]="place.summary" />
  <section class="section">
    <div class="container">
      <img
        class="photo"
        [src]="'images/destinations/' + place.slug + '.jpg'"
        [alt]="place.name"
      />
      <h2>Routes we prepare</h2>
      <ul>
        @for (pathway of place.pathways; track pathway) {
          <li>{{ pathway }}</li>
        }
      </ul>
      <div class="actions">
        <a class="btn btn-primary" routerLink="/contact">Ask about {{ place.name }}</a>
        @if (place.region === 'Europe') {
          <a class="btn btn-ghost" routerLink="/services/european-work-permits">European work permits</a>
        }
      </div>
    </div>
  </section>
  <app-cta-band />
} @else if (loaded()) {
  <app-page-hero title="Destination not found" lede="That country is not listed." />
}
