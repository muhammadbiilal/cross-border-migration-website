<app-page-hero
  eyebrow="Contact"
  title="Free assessment"
  lede="Tell us the goal. A consultant replies with the routes that fit, usually on a work day."
/>
<section class="section">
  <div class="container layout">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label class="field">
        Name
        <input formControlName="name" autocomplete="name" />
        @if (showError('name')) {
          <span class="field-error">Enter your name.</span>
        }
      </label>
      <label class="field">
        Email
        <input type="email" formControlName="email" autocomplete="email" />
        @if (showError('email')) {
          <span class="field-error">Enter a valid email.</span>
        }
      </label>
      <label class="field">
        Phone
        <input formControlName="phone" autocomplete="tel" />
        @if (showError('phone')) {
          <span class="field-error">Enter a phone number.</span>
        }
      </label>
      <label class="field">
        Service
        <select formControlName="service">
          <option value="">Select a service</option>
          @for (service of services; track service.slug) {
            <option [value]="service.title">{{ service.title }}</option>
          }
        </select>
        @if (showError('service')) {
          <span class="field-error">Choose a service.</span>
        }
      </label>
      <label class="field">
        Destination
        <select formControlName="destination">
          <option value="">Select a country</option>
          @for (destination of destinations; track destination.slug) {
            <option [value]="destination.name">{{ destination.name }}</option>
          }
        </select>
        @if (showError('destination')) {
          <span class="field-error">Choose a destination.</span>
        }
      </label>
      <label class="field">
        Message
        <textarea rows="5" formControlName="message"></textarea>
        @if (showError('message')) {
          <span class="field-error">Write at least a short note (10 characters).</span>
        }
      </label>
      <button class="btn btn-primary" type="submit" [disabled]="status() === 'sending'">
        {{ status() === 'sending' ? 'Sending…' : 'Send assessment' }}
      </button>
      @if (status() === 'sent') {
        <p class="notice">Received. We will reply to the email you entered.</p>
      }
      @if (status() === 'failed') {
        <p class="notice notice-error">{{ error() }}</p>
      }
    </form>
    <aside>
      <p><a [href]="site.phoneHref">{{ site.phone }}</a></p>
      <p><a [href]="'mailto:' + site.email">{{ site.email }}</a></p>
      <p>{{ site.address }}</p>
      <p>{{ site.hours }}</p>
    </aside>
  </div>
</section>
