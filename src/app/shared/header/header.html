<header class="header" [class.scrolled]="scrolled()">
  <div class="container bar">
    <a class="brand" routerLink="/" (click)="closeMenu()" [attr.aria-label]="site.name">
      <app-logo />
    </a>
    <button
      type="button"
      class="menu"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="site-nav"
    >
      Menu
    </button>
    <nav id="site-nav" [class.open]="menuOpen()">
      @for (link of links; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="active" (click)="closeMenu()">{{ link.label }}</a>
      }
      <a class="btn btn-primary" routerLink="/contact" (click)="closeMenu()">Free assessment</a>
    </nav>
  </div>
</header>
