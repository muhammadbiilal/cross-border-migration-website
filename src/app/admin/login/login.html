<div class="wrap">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <a routerLink="/" aria-label="Cross Border Migration"><app-logo /></a>
    <h1>Staff sign-in</h1>
    <p>Accounts are created in Supabase. There is no public registration.</p>
    @if (!configured) {
      <p class="notice notice-error">Add the Supabase URL and anon key before signing in.</p>
    }
    <label class="field">
      Email
      <input type="email" formControlName="email" autocomplete="username" />
    </label>
    <label class="field">
      Password
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>
    @if (error()) {
      <p class="notice notice-error">{{ error() }}</p>
    }
    <button class="btn btn-primary" type="submit" [disabled]="busy()">
      {{ busy() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
